# Local sanity-check + reference compose file.
#
# This is NOT what production runs. Coolify generates its own compose-equivalent
# config per tenant from the same Docker image. This file exists so:
#   1. Developers can `docker compose up` locally to verify the image works.
#   2. Self-hosters who prefer Docker have a documented starting point.
#   3. The shape of production deployment is visible (env vars, volumes, ports).

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/pao2pao16/venta:local
    container_name: venta-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      APP_NAME: "${APP_NAME:-VentaCart}"
      APP_ENV: "${APP_ENV:-production}"
      APP_DEBUG: "${APP_DEBUG:-false}"
      APP_KEY: "${APP_KEY}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      # Empty: nothing in front of this compose file. Set private_ranges when
      # a proxy on the same Docker network terminates HTTPS for it.
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-}"
      LOG_CHANNEL: stack
      LOG_LEVEL: info
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: "${DB_DATABASE:-venta}"
      DB_USERNAME: "${DB_USERNAME:-venta}"
      DB_PASSWORD: "${DB_PASSWORD:-venta}"
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      BROADCAST_CONNECTION: log
      MAIL_MAILER: log
      VENTA_RUN_SEEDERS: "${VENTA_RUN_SEEDERS:-false}"
    volumes:
      - app_storage:/var/www/html/storage/app
      - app_logs:/var/www/html/storage/logs

  db:
    image: mariadb:11
    container_name: venta-db
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: "${DB_DATABASE:-venta}"
      MARIADB_USER: "${DB_USERNAME:-venta}"
      MARIADB_PASSWORD: "${DB_PASSWORD:-venta}"
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  app_storage:
  app_logs:
  db_data:
