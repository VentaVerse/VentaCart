; Overrides on top of the upstream php-fpm config.
; The default pool name is [www] — this file replaces those settings.

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000
listen.allowed_clients = 127.0.0.1

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Send logs to container stdout so docker logs / Coolify can capture them
catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2

; Status endpoint so the orchestrator / health checks can scrape FPM state
pm.status_path = /fpm-status
ping.path = /fpm-ping
