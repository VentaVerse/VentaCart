; Production-oriented overrides. Tune per tenant via env vars if needed.

memory_limit = 256M
upload_max_filesize = 20M
post_max_size = 25M
max_execution_time = 60
max_input_time = 60
max_input_vars = 5000

date.timezone = UTC

expose_php = Off

; Sessions handled by Laravel (database driver), not native PHP sessions
session.use_strict_mode = 1
